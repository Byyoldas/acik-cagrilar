<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Açık Çağrılar</title>

<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --card: #ffffff; --text: #1b2430; --muted: #5f6b7a; --line: #e3e7ed;
    --accent: #00338D; --accent-soft: #e6ebf5; --on-accent: #ffffff; --brand2: #A30050;
    --urgent-bg: #f8e4ed; --urgent-fg: #A30050;
    --soon-bg: #fff3dc; --soon-fg: #8a5a00;
    --ok-bg: #e8f3ec; --ok-fg: #1d6b3a;
    --cont-bg: #e9eef6; --cont-fg: #33507a;
    --shadow: 0 1px 2px rgba(20,30,50,.05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #12161c; --card: #1a2029; --text: #e8ecf1; --muted: #9aa6b5; --line: #2a3340;
    --accent: #8fb0f0; --accent-soft: #1b2740; --on-accent: #0b1a3d; --brand2: #ff8cbc;
    --urgent-bg: #3d1a2b; --urgent-fg: #ff8cbc;
    --soon-bg: #3b2f14; --soon-fg: #f5c46a;
    --ok-bg: #173223; --ok-fg: #7fd3a0;
    --cont-bg: #1f2a3a; --cont-fg: #9db8e0;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { margin: 0 0 4px; font-size: 1.9rem; letter-spacing: -.01em; }
  .lead { margin: 0 0 20px; color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .tools { display: flex; gap: 8px; flex-shrink: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: .8rem; font-weight: 600;
    padding: 5px 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .seg button:focus-visible, .chip:focus-visible, .dl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .search { flex: 1 1 240px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--text); font: inherit; }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
    font-size: .88rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .subchips { margin: 8px 0 0 12px; padding-left: 12px; border-left: 3px solid var(--brand2); }
  .subchips:empty { display: none; }
  .dl { margin-left: auto; font: inherit; font-size: .88rem; padding: 7px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .dl:hover, .chip:hover { border-color: var(--accent); }
  .stats { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }

  h2 { font-size: 1.2rem; margin: 32px 0 4px; display: flex; align-items: baseline; gap: 8px; }
  h2 .n { font-size: .85rem; font-weight: 500; color: var(--muted); }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
  h3.group { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 22px 0 8px; font-weight: 600; }

  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: var(--shadow); }
  .item.is-urgent { border-left: 4px solid var(--urgent-fg); }
  .item h3 { margin: 4px 0 2px; font-size: 1.02rem; line-height: 1.35; font-weight: 600; }
  .prog { margin: 0; color: var(--muted); font-size: .85rem; }
  .note { margin: 4px 0 0; color: var(--muted); font-size: .82rem; font-style: italic; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); }
  .tag.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }

  .when { text-align: right; min-width: 210px; }
  .range { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .range b { color: var(--text); font-weight: 600; }
  .badge { display: inline-block; margin-top: 6px; font-size: .8rem; font-weight: 600;
    padding: 3px 10px; border-radius: 999px; }
  .badge.urgent { background: var(--urgent-bg); color: var(--urgent-fg); }
  .badge.soon { background: var(--soon-bg); color: var(--soon-fg); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.cont { background: var(--cont-bg); color: var(--cont-fg); }
  .opens { display: block; margin-top: 4px; font-size: .78rem; color: var(--muted); }

  .links { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding-top: 10px; border-top: 1px solid var(--line); }
  .links a { font-size: .9rem; color: var(--accent); text-decoration: none; font-weight: 500; }
  .links a:hover { text-decoration: underline; }
  .links a.apply { background: var(--accent); color: var(--on-accent); padding: 6px 14px; border-radius: 8px; }
  .links a.apply:hover { text-decoration: none; opacity: .9; }

  details.det { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px; }
  details.det summary { cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--accent); }
  .dgrid { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 10px 0 0; font-size: .88rem; }
  .dgrid dt { color: var(--muted); } .dgrid dd { margin: 0; }
  .vflag { display: inline-block; margin-top: 8px; font-size: .75rem; padding: 2px 8px; border-radius: 6px; }
  .vflag.dogrulandi { background: var(--ok-bg); color: var(--ok-fg); }
  .vflag.kismi { background: var(--cont-bg); color: var(--cont-fg); }
  .vflag.otomatik { background: var(--soon-bg); color: var(--soon-fg); }
  .vflag.celiski { background: var(--urgent-bg); color: var(--urgent-fg); }
  @media (max-width: 640px) { .dgrid { grid-template-columns: 1fr; } }
  .tag.new { background: var(--brand2); color: var(--on-accent); }
  h1 { color: var(--accent); }
  h2 { border-left: 4px solid var(--brand2); padding-left: 10px; }
  .newbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow); }
  .newrow { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 16px; align-items: center;
    padding: 11px 16px; text-decoration: none; color: var(--text); border-top: 1px solid var(--line); }
  .newrow:first-child { border-top: 0; }
  .newrow:hover { background: var(--accent-soft); }
  .newdate { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .newtitle { font-weight: 600; font-size: .95rem; line-height: 1.35; }
  .newmeta { font-size: .82rem; color: var(--muted); text-align: right; white-space: nowrap; }
  .newmeta b { color: var(--text); font-weight: 600; }
  .newmeta .badge { margin: 0 0 0 6px; padding: 2px 8px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--card);
    border: 1px dashed var(--line); border-radius: 12px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .82rem; }
  footer a { color: var(--accent); }

  @media (max-width: 640px) {
    .item { grid-template-columns: 1fr; }
    .when { text-align: left; min-width: 0; }
    .dl { margin-left: 0; }
    .newrow { grid-template-columns: 1fr; }
    .newmeta { text-align: left; white-space: normal; }
  }
</style>
</head>

<div class="wrap">
  <div class="top">

  <p class="lead" id="lead">TÜBİTAK başvuru sistemlerinde şu anda açık olan çağrı ve programlar.</p>

  <div id="list"></div>

  <footer id="foot"></footer>
</div>

function t(k, v) {
  let s = (I18N[LANG][k] != null ? I18N[LANG][k] : I18N.tr[k]);
  if (s == null) return k;
  if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]);
  return s;
}
/* Veri içindeki tekrarlayan kalıplar (çağrı başlıkları gibi serbest metinler kaynak dilinde kalır). */
const PH = [
  ["Ufuk Avrupa · Doğrudan çağrı (AB)", "Horizon Europe · Direct call (EU)"],
  ["Ufuk Avrupa · Kademeli fonlama (üçüncü taraf çağrısı)", "Horizon Europe · Cascade funding (third-party call)"],

  ["TÜBİTAK Duyuruları (başvuru sistemi listelerinde yer almayan çağrılar)", "TÜBİTAK Announcements (calls not listed in the application systems)"],
  ["Araştırma Destek Programları", "Research Support Programmes"],
  ["Uluslararası İşbirliği", "International Cooperation"],
  ["Bilim ve Toplum", "Science and Society"],
  ["Bilim İnsanı Destek Programları", "Scientist Support Programmes"],
  ["İstanbul Kalkınma Ajansı", "Istanbul Development Agency"],
  ["Türkiye Sağlık Enstitüleri Başkanlığı", "Turkish Health Institutes (TÜSEB)"],
  ["Ufuk Avrupa", "Horizon Europe"],
  ["Erasmus+ (Merkezi çağrılar ve Ulusal Ajans çağrıları)", "Erasmus+ (centralised and National Agency calls)"],
  ["Erasmus+ · Doğrudan çağrı (AB)", "Erasmus+ · Direct call (EU)"],

  ["Gösterilen tarih bir sonraki son tarihtir.", "The date shown is the next deadline."],
  ["Aynı çağrı TÜBİTAK kaynaklarında ulusal son tarihle de listelenebilir; burada AB/konsorsiyum tarihi gösterilir.", "The same call may also be listed in TÜBİTAK sources with a national deadline; the EU/consortium date is shown here."],
  ["Tarih duyuru metninden otomatik çıkarıldı; doğrulayınız.", "Date was extracted automatically from the announcement text; please verify."],
  ["Duyuruda belirtilmemiş", "Not stated in the announcement"],
  ["Resmi sayfada tutar bulunamadı", "No amount found on the official page"],

]; 
const PH_RE = [[/(\d) ay(?![\p{L}])/gu, "$1 months"], [/(\d) yıl(?![\p{L}])/gu, "$1 years"]];
function tx(s) {
  if (LANG === "tr" || !s) return s;
  let o = String(s);
  for (const [a, b] of PH) if (o.indexOf(a) >= 0) o = o.split(a).join(b);
  for (const [re, b] of PH_RE) o = o.replace(re, b);
  return o;
}
function srcFull(k) { return tx(SOURCES[k].full); }
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.getElementById("h1").textContent = t("title");
  document.getElementById("lead").textContent = t("lead");
  const q = document.getElementById("q"); q.placeholder = t("ph"); q.setAttribute("aria-label", t("aria_q"));
  document.getElementById("dl").textContent = t("dl");
  document.getElementById("chips").setAttribute("aria-label", t("aria_chips"));
  document.getElementById("subchips").setAttribute("aria-label", t("aria_sub"));
  document.getElementById("thl").textContent = t("th_light");
  document.getElementById("thd").textContent = t("th_dark");
  document.querySelectorAll("#langseg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
}
function applyTheme(th) {
  document.documentElement.setAttribute("data-theme", th);
  document.querySelectorAll("#themeseg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === th)));
}
function fullRender() { applyLang(); renderChips(); renderSubChips(); render(); renderFoot(); }
document.getElementById("langseg").addEventListener("click", e => {

  LANG = b.dataset.lang; try { localStorage.setItem("ac-lang", LANG); } catch (x) {}
  fullRender();
});
document.getElementById("themeseg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  try { localStorage.setItem("ac-theme", b.dataset.themeBtn); } catch (x) {}
  applyTheme(b.dataset.themeBtn);
});

/* ---------------- Mantık ---------------- */
const NOW = new Date();
const SRC_ORDER = ["ardeb", "uidb", "bt", "bideb", "duyuru", "istka", "tuseb", "erasmus", "eu"];

function parseEnd(s)   { if (!s) return null; return s.length === 10 ? new Date(s + "T23:59:59") : new Date(s + ":00"); }
function parseStart(s) { if (!s) return null; return new Date(s.length === 10 ? s + "T00:00:00" : s + ":00"); }
function dayStart(d)   { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayDiff(a, b) { return Math.round((dayStart(b) - dayStart(a)) / 864e5); }
function p2(n)         { return String(n).padStart(2, "0"); }
function fmt(s) {
  if (!s) return "";
  const d = s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4);
  return s.length > 10 ? d + " " + s.slice(11, 16) : d;
}
function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function applyUrl(r) {
  const s = SOURCES[r.src];
  if (s.noApply) return "";
  if (s.apply) return s.apply;
  return s.base + "/pb/programCagriList.htm?programId=" + encodeURIComponent(r.pid);
}

const toRow = a => {
  if (!SOURCES[a[0]]) { SOURCES[a[0]] = { label: a[0], full: a[0], base: "#", noApply: true }; SRC_ORDER.push(a[0]); }
  return toRow0(a);
};
const toRow0 = a => ({
  src: a[0], program: a[1], cagri: a[2], kategori: a[3], kod: a[4],
  startRaw: a[5], endRaw: a[6], start: parseStart(a[5]), end: parseEnd(a[6]),
  second: !!a[7], bilgi: a[8], pid: a[9], note: a[10] || "", announced: a[11] || ""
});
let ALL = DATA.map(toRow);
/* "Yeni açılan": duyuru tarihi ya da başlangıç (açılış) tarihi son NEW_DAYS gün içinde olan çağrılar; Ufuk Avrupa hariç. */
function openedOn(r) { return r.announced || (r.src !== "eu" ? (r.startRaw || "").slice(0, 10) : ""); }
function isNew(r) {
  if (r.src === "eu") return false;
  const o = openedOn(r); if (!o) return false;
  const d = dayDiff(parseStart(o), NOW);
  return d >= 0 && d <= NEW_DAYS;
}
let EXPIRED = 0, LIVE = [];
function recompute() {
  EXPIRED = ALL.filter(r => r.end && r.end < NOW).length;
  LIVE = ALL.filter(r => !(r.end && r.end < NOW));
}
recompute();

let state = { src: "all", q: "", sub: "all" };
const SUBS = [["all", "all", null], ["dogrudan", "direct", "Doğrudan"], ["kademeli", "cascade", "Kademeli"]];

function matches(r) {
  if (state.src === "all" && SOURCES[r.src].hideInAll && !state.q) return false;
  if (state.src !== "all" && r.src !== state.src) return false;
  if (state.src === "eu" && state.sub !== "all") {
    const s = SUBS.find(x => x[0] === state.sub);
    if (s && !r.program.includes(s[2])) return false;
  }
  if (!state.q) return true;
  const hay = (r.cagri + " " + r.program + " " + r.kod + " " + r.kategori).toLocaleLowerCase("tr");
  return hay.includes(state.q.toLocaleLowerCase("tr"));
}

function badgeFor(r) {
  if (!r.end) return { cls: "cont", text: t("cont") };
  const d = dayDiff(NOW, r.end);
  if (d <= 0) return { cls: "urgent", text: t("today") };
  if (d === 1) return { cls: "urgent", text: t("tomorrow") };
  if (d <= 7)  return { cls: "urgent", text: t("days", { n: d }) };
  if (d <= 30) return { cls: "soon",   text: t("days", { n: d }) };
  return { cls: "ok", text: t("days", { n: d }) };
}

const NA = () => '<span style="color:var(--muted)">' + esc(t("na")) + "</span>";
function detailsHTML(r) {
  const e = enrichFor(r); if (!e) return "";
  const row = (k, v) => "<dt>" + esc(t(k)) + "</dt><dd>" + (v ? esc(tx(v)) : NA()) + "</dd>";
  let g = row("d_sure", e.sure) + row("d_butce", e.butce);
  if (e.acilis) g += row("d_acilis", fmt(e.acilis));
  if (e.intl) g += row("d_intl", /[A-Z]/.test(e.intl) ? fmt(e.intl.slice(0,16)) + " " + e.intl.slice(16).trim() : fmt(e.intl));
  if (e.natl) g += row("d_natl", fmt(e.natl));
  if (e.esign) g += row("d_esign", fmt(e.esign));
  if (e.kimler) g += row("d_kimler", e.kimler);
  if (e.not) g += row("d_not", e.not);
  return '<details class="det"><summary>' + esc(t("details")) + '</summary><dl class="dgrid">' + g + "</dl>" +
    '<span class="vflag ' + e.durum + '">' + esc(t("v_" + e.durum)) + "</span>" +
    (e.kaynak ? ' <a href="' + esc(e.kaynak) + '" target="_blank" rel="noopener" style="font-size:.8rem">' + esc(t("source")) + "</a>" : "") + "</details>";
}

const LINKL = { "Portalda aç": "link_portal", "Programı incele ve başvur": "link_program", "Çağrıyı incele ve başvur": "link_call" };
function linkLabel(r) { const l = SOURCES[r.src].linkLabel; return t(l && LINKL[l] ? LINKL[l] : "link_default"); }

function itemHTML(r) {
  const b = badgeFor(r);
  const s = SOURCES[r.src];
  const urgent = r.end && dayDiff(NOW, r.end) <= 7;
  let when = "";
  if (r.end) {
    const midnight = r.endRaw.length > 10 && r.endRaw.endsWith("T00:00");
    const startTxt = r.startRaw ? fmt(r.startRaw) : "";
    when += '<div class="range">' + (startTxt ? esc(startTxt) + " – " : esc(t("last"))) +
      "<b" + (midnight ? ' title="' + esc(t("midnight")) + '"' : "") + ">" +
      esc(fmt(r.endRaw)) + (midnight ? " ⓘ" : "") + "</b></div>";
    if (r.start && r.start > NOW) when += '<span class="opens">' + esc(t("opens", { d: fmt(r.startRaw) })) + "</span>";
  }
  when += '<span class="badge ' + b.cls + '">' + esc(b.text) + "</span>";

  const tags = (isNew(r) ? '<span class="tag new">' + esc(t("tag_new")) + "</span>" : "") +
    '<span class="tag">' + esc(s.label) + "</span>" +
    (r.second ? '<span class="tag plain">' + esc(t("tag_2")) + '</span>' : "") +
    (r.kod ? '<span class="tag plain">' + esc(r.kod) + "</span>" : "");
  const prog = tx(r.program) + (r.kategori && r.kategori !== r.program ? " · " + tx(r.kategori) : "");

  return '<article class="item' + (urgent ? " is-urgent" : "") + '">' +
    '<div class="main"><div class="tags">' + tags + "</div>" +
    "<h3>" + esc(r.cagri) + "</h3>" +
    '<p class="prog">' + esc(prog) + "</p>" +
    (r.note ? '<p class="note">' + esc(tx(r.note)) + "</p>" : "") +
    (r.announced ? '<p class="note">' + esc(t("announced")) + esc(fmt(r.announced)) + "</p>" : "") +
    "</div>" +
    '<div class="when">' + when + "</div>" +
    '<div class="links">' +
    (SOURCES[r.src].noApply
      ? (r.bilgi ? '<a class="apply" href="' + esc(r.bilgi) + '" target="_blank" rel="noopener">' + esc(linkLabel(r)) + '</a>' : "")
      : '<a class="apply" href="' + esc(applyUrl(r)) + '" target="_blank" rel="noopener">' + esc(t("apply")) + '</a>' +
        (r.bilgi ? '<a href="' + esc(r.bilgi) + '" target="_blank" rel="noopener">' + esc(t("info")) + '</a>' : "")) +
    "</div>" + detailsHTML(r) + "</article>";
}

function newRowHTML(r) {
  const b = badgeFor(r);
  const when = r.end ? esc(t("last_app")) + "<b>" + esc(fmt(r.endRaw)) + "</b>" : esc(t("cont"));
  return '<a class="newrow" href="' + esc(r.bilgi || applyUrl(r) || "#") + '" target="_blank" rel="noopener">' +
    '<span class="newdate">' + esc(fmt(openedOn(r))) + "</span>" +
    '<span class="newtitle">' + esc(r.cagri) + "</span>" +
    '<span class="newmeta">' + when + ' <span class="badge ' + b.cls + '">' + esc(b.text) + "</span></span></a>";
}

function render() {
  const rows = LIVE.filter(matches);
  const dated = rows.filter(r => r.end).sort((a, b) => a.end - b.end);
  const cont = rows.filter(r => !r.end);
  const fresh = rows.filter(isNew).sort((a, b) => openedOn(b).localeCompare(openedOn(a)));

  let html = "";
  if (fresh.length) {
    html += "<h2>" + esc(t("h_new")) + ' <span class="n">' + esc(t("new_n", { d: NEW_DAYS, n: fresh.length })) + "</span></h2>" +
      '<p class="sub">' + esc(t("new_sub")) + "</p>" +
      '<div class="newbox">' + fresh.map(newRowHTML).join("") + "</div>";
  }
  if (dated.length) {
    html += "<h2>" + esc(t("h_soon")) + ' <span class="n">' + esc(t("soon_n", { n: dated.length })) + "</span></h2>" +
      '<p class="sub">' + esc(t("soon_sub")) + "</p>" +
      dated.map(itemHTML).join("");
  }
  if (cont.length) {
    html += "<h2>" + esc(t("h_cont")) + ' <span class="n">' + esc(t("cont_n", { n: cont.length })) + "</span></h2>" +
      '<p class="sub">' + esc(t("cont_sub")) + "</p>";
    SRC_ORDER.forEach(k => {
      const g = cont.filter(r => r.src === k);
      if (g.length) html += '<h3 class="group">' + esc(srcFull(k)) + "</h3>" + g.map(itemHTML).join("");
    });
  }
  if (!html) html = '<div class="empty">' + esc(t("empty")) + "</div>";

  document.getElementById("list").innerHTML = html;
  document.getElementById("stats").textContent =
    t("stats", { n: rows.length }) + (state.src === "all" && !state.q ? t("stats_eu") : "") + t("stats_tail", { a: dated.length, b: cont.length });
}

function renderSubChips() {
  const el = document.getElementById("subchips");
  if (state.src !== "eu") { el.innerHTML = ""; return; }
  const eu = LIVE.filter(r => r.src === "eu");
  el.innerHTML = SUBS.map(([k, l, m]) => {
    const n = m ? eu.filter(r => r.program.includes(m)).length : eu.length;
    return '<button type="button" class="chip" data-s="' + k + '" aria-pressed="' + (state.sub === k) + '">' + esc(t(l)) + " (" + n + ")</button>";
  }).join("");
}

function renderChips() {
  const el = document.getElementById("chips");
  const items = [["all", t("all")]].concat(SRC_ORDER.filter(k => LIVE.some(r => r.src === k)).map(k => [k, (LANG === "en" && SOURCES[k].label === "Duyuru") ? "Announcements" : tx(SOURCES[k].label)]));
  el.innerHTML = items.map(([k, l]) => {
    const n = k === "all" ? LIVE.filter(r => !SOURCES[r.src].hideInAll).length : LIVE.filter(r => r.src === k).length;
    return '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + (state.src === k) + '">' + esc(l) + " (" + n + ")</button>";
  }).join("");
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.src = b.dataset.k; state.sub = "all"; renderChips(); renderSubChips(); render();
});
document.getElementById("subchips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.sub = b.dataset.s; renderSubChips(); render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });

document.getElementById("dl").addEventListener("click", () => {
  const rows = LIVE.filter(matches).sort((a, b) => (a.end ? a.end : 8.64e15) - (b.end ? b.end : 8.64e15));
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = t("csv");
  const lines = [head.map(q).join(";")].concat(rows.map(r => [
    SOURCES[r.src].label, tx(r.program), r.cagri, tx(r.kategori), r.kod, fmt(r.startRaw), fmt(r.endRaw),
    r.end ? t("csv_dated") : t("csv_cont"), fmt(r.announced), tx(r.note), r.bilgi, applyUrl(r),
    tx((enrichFor(r)||{}).sure), tx((enrichFor(r)||{}).butce), fmt((enrichFor(r)||{}).natl), fmt(((enrichFor(r)||{}).intl||"").slice(0,16)), (enrichFor(r)||{}).durum
  ].map(q).join(";")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "acik-cagrilar-" + NOW.getFullYear() + "-" + p2(NOW.getMonth() + 1) + "-" + p2(NOW.getDate()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

function renderFoot() {
  document.getElementById("foot").innerHTML =
  esc(t("f_demo", { d: DATA_DATE })) + esc(t("f_eu")) + (EXPIRED ? esc(t("f_exp", { n: EXPIRED })) : "") +
  esc(t("f_src")) +
  SRC_ORDER.map(k => '<a href="' + esc(SOURCES[k].base) + '" target="_blank" rel="noopener">' + esc(SOURCES[k].label) + "</a>").join(", ") + ".";
}
applyTheme(document.documentElement.getAttribute("data-theme") || "light");
fullRender();

/* Canlı veri: günlük betiğin ürettiği cagrilar.json aynı klasörde varsa onu kullanır;
   yoksa (ya da okunamazsa) sayfaya gömülü demo verisiyle çalışmaya devam eder. */
(typeof fetch === "function" ? fetch("cagrilar.json", { cache: "no-store" }) : Promise.reject())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    if (!Array.isArray(j.rows) || !j.rows.length) return;
    ALL = j.rows.map(toRow);
    ENRICH = Array.isArray(j.enrich) ? j.enrich : [];
    DATA_DATE = (j.generated || "").slice(8, 10) + "." + (j.generated || "").slice(5, 7) + "." + (j.generated || "").slice(0, 4);
    recompute(); fullRender();
  })
  .catch(() => {});

/* iframe içinde gömülüyse yüksekliği üst sayfaya bildir (WordPress vb. otomatik yükseklik için) */
(function () {
  if (window.parent === window) return;
  var last = 0;
  function send() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== last) { last = h; try { window.parent.postMessage({ type: "acik-cagrilar-height", height: h }, "*"); } catch (e) {} }
  }
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
  window.addEventListener("load", send); window.addEventListener("resize", send);
  setInterval(send, 1500);
})();
</script>
